[package]
name = "rime-api"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
description = "Generated Rime speech protocol types and gRPC clients"
license = "Apache-2.0"
repository = "https://github.com/rimelabs/rime-api"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE", "NOTICE", "SOURCE.json"]

[features]
default = ["grpc"]
grpc = ["dep:tonic", "dep:tonic-prost"]

[dependencies]
prost = "0.14"
pbjson = "0.8"
pbjson-types = "0.8"
serde = { version = "1", features = ["derive"] }
tonic = { version = "0.14", optional = true, default-features = false, features = ["codegen", "transport"] }
tonic-prost = { version = "0.14", optional = true }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }

[lints.rust]
unsafe_code = "forbid"
