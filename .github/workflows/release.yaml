name: Release packages
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Check packages run ID from main
        required: true
        type: string
      version:
        description: Package version, such as 0.0.1
        required: true
        type: string
      registry:
        description: Registry to publish
        required: true
        type: choice
        default: both
        options: [npm, pypi, both]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  # Selection happens before dispatch. Hold this lock through finalization.
  group: release-packages-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.selection.outputs.run_id }}
      version: ${{ steps.selection.outputs.version }}
      registry: ${{ steps.selection.outputs.registry }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Select the checked release commit
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --python 3.13 python tools/release.py select \
            --event "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"
      - name: Verify and download tested archives
        if: steps.selection.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ steps.selection.outputs.run_id }}
          RELEASE_VERSION: ${{ steps.selection.outputs.version }}
        run: |
          uv run --no-project --python 3.13 python tools/release.py prepare \
            --run-id "$RELEASE_RUN_ID" --version "$RELEASE_VERSION" --directory release-dist
      - name: Check existing registry versions
        if: steps.selection.outputs.run_id != ''
        env:
          RELEASE_REGISTRY: ${{ steps.selection.outputs.registry }}
        run: |
          uv run --no-project --python 3.13 python tools/release.py registry \
            --registry "$RELEASE_REGISTRY" --directory release-dist
      - uses: actions/upload-artifact@v7
        if: steps.selection.outputs.run_id != ''
        with:
          name: release-dist-${{ steps.selection.outputs.version }}
          path: release-dist/
          retention-days: 90
  npm:
    needs: prepare
    if: needs.prepare.outputs.registry == 'npm' || needs.prepare.outputs.registry == 'both'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-dist-${{ needs.prepare.outputs.version }}
          path: release-dist/
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check whether npm needs publication
        id: existing
        run: |
          uv run --no-project --python 3.13 python tools/release.py registry \
            --registry npm --directory release-dist >> "$GITHUB_OUTPUT"
      - name: Publish to npm with Trusted Publishing
        if: steps.existing.outputs.npm_publish_required == 'true'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          # npm provenance is unavailable for private source repositories.
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
        run: |
          npm publish "./release-dist/rime-api-$RELEASE_VERSION.tgz" --access public \
            --registry=https://registry.npmjs.org \
            --@rimelabs:registry=https://registry.npmjs.org
      - name: Download and verify the published npm archive
        run: |
          uv run --no-project --python 3.13 python tools/release.py registry \
            --registry npm --directory release-dist --download "$RUNNER_TEMP/npm-release"
      - name: Test installation from npm
        run: bash tests/test_installed_javascript.sh "$RUNNER_TEMP/npm-release/"*.tgz
  pypi:
    needs: prepare
    if: needs.prepare.outputs.registry == 'pypi' || needs.prepare.outputs.registry == 'both'
    runs-on: ubuntu-latest
    environment: pypi-release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-dist-${{ needs.prepare.outputs.version }}
          path: release-dist/
      - uses: astral-sh/setup-uv@v7
      - name: Check whether PyPI needs publication
        id: existing
        run: |
          uv run --no-project --python 3.13 python tools/release.py registry \
            --registry pypi --directory release-dist >> "$GITHUB_OUTPUT"
      - name: Publish to PyPI with Trusted Publishing
        if: steps.existing.outputs.pypi_publish_required == 'true'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          uv publish --trusted-publishing always \
            "release-dist/rime_api-$RELEASE_VERSION-py3-none-any.whl" \
            "release-dist/rime_api-$RELEASE_VERSION.tar.gz"
      - name: Download and verify the published Python archives
        run: |
          uv run --no-project --python 3.13 python tools/release.py registry \
            --registry pypi --directory release-dist --download "$RUNNER_TEMP/pypi-release"
      - name: Test installation from PyPI
        run: |
          for distribution in "$RUNNER_TEMP/pypi-release/"*; do
            uv run --isolated --no-project --python 3.13 --with "$distribution" \
              python tests/packages_test.py --fixtures tests/fixtures.json
          done
  finalize:
    needs: [prepare, npm, pypi]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.run_id != '' && (needs.npm.result == 'success' || needs.npm.result == 'skipped') && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-dist-${{ needs.prepare.outputs.version }}
          path: release-dist/
      - uses: astral-sh/setup-uv@v7
      - name: Check whether both registries are complete
        id: published
        run: |
          uv run --no-project --python 3.13 python tools/release.py ready \
            --directory release-dist >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        if: steps.published.outputs.ready == 'true' && needs.npm.result == 'skipped'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify npm after a Python-only recovery
        if: steps.published.outputs.ready == 'true' && needs.npm.result == 'skipped'
        run: |
          uv run --no-project --python 3.13 python tools/release.py registry \
            --registry npm --directory release-dist --download "$RUNNER_TEMP/npm-release"
          bash tests/test_installed_javascript.sh "$RUNNER_TEMP/npm-release/"*.tgz
      - name: Verify PyPI after an npm-only recovery
        if: steps.published.outputs.ready == 'true' && needs.pypi.result == 'skipped'
        run: |
          uv run --no-project --python 3.13 python tools/release.py registry \
            --registry pypi --directory release-dist --download "$RUNNER_TEMP/pypi-release"
          for distribution in "$RUNNER_TEMP/pypi-release/"*; do
            uv run --isolated --no-project --python 3.13 --with "$distribution" \
              python tests/packages_test.py --fixtures tests/fixtures.json
          done
      - name: Select the tested Go toolchain
        id: go_toolchain
        if: steps.published.outputs.ready == 'true'
        run: |
          release_commit=$(jq -er '.commit | select(type == "string") | select(test("^[0-9a-f]{40}$"))' release-dist/RELEASE.json)
          git cat-file -e "$release_commit^{commit}"
          if git cat-file -e "$release_commit:go/go.mod" 2>/dev/null; then
            git show "$release_commit:go/go.mod" > "$RUNNER_TEMP/release-go.mod"
            echo "version_file=$RUNNER_TEMP/release-go.mod" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v6
        if: steps.published.outputs.ready == 'true' && steps.go_toolchain.outputs.version_file != ''
        with:
          go-version-file: ${{ steps.go_toolchain.outputs.version_file }}
          cache: false
      - name: Create the verified tag and GitHub release
        if: steps.published.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          uv run --no-project --python 3.13 python tools/release.py finalize --directory release-dist
      - name: Prepare any changes merged during publication
        if: steps.published.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-please.yaml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Report incomplete publication
        if: steps.published.outputs.ready != 'true'
        run: |
          echo 'The other registry is incomplete. Retry the same run ID and version for that registry. No tag or GitHub release was created.' >> "$GITHUB_STEP_SUMMARY"
