name: Check packages
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: 1.x
          repository-cache: true
      - uses: astral-sh/setup-uv@v7
      - name: Check Python dependency lock
        run: |
          uv lock --check
          uv export --locked --format requirements-txt --no-emit-project --output-file /tmp/rime-api-requirements.txt
          diff <(sed '/^#/d' requirements.txt) <(sed '/^#/d' /tmp/rime-api-requirements.txt)
      - name: Check format
        run: bazel run //:format_check
      - name: Validate schemas and report compatibility
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMPATIBILITY_REPORT: ${{ runner.temp }}/api-compatibility.md
        run: bash tools/check_compatibility.sh
      - uses: actions/upload-artifact@v7
        with:
          name: api-compatibility
          path: ${{ runner.temp }}/api-compatibility.md
      - name: Verify generated Go protocol
        run: bazel run //:update_go -- --check
      - name: Verify generated Rust protocol
        run: bazel run //:update_rust -- --check
      - name: Build and test
        run: |
          bazel test //tests/...
          mkdir -p dist
          output=$(bazel cquery --output=files //:packages)
          cp "$output"/dist/* dist/
          bazel run //:cargo -- package -p rimelabs-api --locked
          cp target/package/rimelabs-api-*.crate dist/
      - name: Check release metadata
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          arguments=()
          if [[ -n "$RELEASE_TAG" ]]; then arguments+=("$RELEASE_TAG"); fi
          uv run --no-project python tools/check_release.py "${arguments[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: rime-api-dist
          path: dist/
  python:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        protobuf: ['protobuf==5.29.6', 'protobuf==6.33.5', 'protobuf==7.36.1', 'protobuf']
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: rime-api-dist
          path: dist/
      - name: Test installed wheel and source distribution
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          PROTOBUF_REQUIREMENT: ${{ matrix.protobuf }}
        run: |
          for distribution in dist/*.whl dist/*.tar.gz; do
            for implementation in upb python; do
              PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION="$implementation" \
                uv run --isolated --no-project --python "$PYTHON_VERSION" \
                  --with "$distribution" --with "$PROTOBUF_REQUIREMENT" \
                  python tests/packages_test.py --fixtures tests/fixtures.json
            done
          done
  javascript:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8
        with:
          name: rime-api-dist
          path: dist/
      - name: Test installed npm package
        run: bash tests/test_installed_javascript.sh dist/*.tgz
  go:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.24.x', stable]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.sum
      - name: Test the public Go module
        working-directory: go
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go vet ./...
          go test -race ./... -args -fixtures ../tests/fixtures.json
          CGO_ENABLED=0 go build ./...
  rust:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ['1.88.0', stable]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy -p rimelabs-api --all-targets --locked -- -D warnings
      - run: cargo test -p rimelabs-api --locked
      - run: cargo test -p rimelabs-api --locked --no-default-features
      - run: cargo package -p rimelabs-api --locked
